    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          document.documentElement.setAttribute('data-theme', stored === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
